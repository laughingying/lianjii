<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 哑铃图标 -->
  <g transform="translate(256, 256)">
    <!-- 中间杆 -->
    <rect x="-8" y="-100" width="16" height="200" rx="8" fill="url(#accent)"/>
    <!-- 左侧哑铃片 -->
    <rect x="-60" y="-70" width="24" height="140" rx="12" fill="url(#accent)"/>
    <rect x="-90" y="-50" width="20" height="100" rx="10" fill="url(#accent)" opacity="0.8"/>
    <!-- 右侧哑铃片 -->
    <rect x="36" y="-70" width="24" height="140" rx="12" fill="url(#accent)"/>
    <rect x="70" y="-50" width="20" height="100" rx="10" fill="url(#accent)" opacity="0.8"/>
  </g>
  <!-- 底部文字 -->
  <text x="256" y="430" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="bold" fill="#4ade80" text-anchor="middle" letter-spacing="8">练记</text>
</svg>
